name: release
on:
  push:
    tags: ['v*', '*/v*']
permissions: {}
jobs:
  checks:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore tests/ModuleChecks.csproj --locked-mode
      - run: dotnet run --project tests -c Release --no-restore
  release:
    needs: checks
    uses: voxta-ai/voxta-module-actions/.github/workflows/release.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      publish: ${{ vars.VOXTA_PUBLISH == 'true' }}
      api-url: ${{ vars.VOXTA_API_URL || 'https://api.voxta.ai' }}
