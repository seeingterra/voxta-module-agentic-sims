name: edit release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
      voxta:
        description: New compatibility range (empty keeps current)
      yanked:
        description: Withdraw release
        type: choice
        options: [unchanged, 'yes', 'no']
        default: unchanged
permissions: {}
jobs:
  edit:
    uses: voxta-ai/voxta-module-actions/.github/workflows/edit-release.yml@v1
    permissions:
      contents: write
      id-token: write
    with:
      tag: ${{ inputs.tag }}
      voxta: ${{ inputs.voxta }}
      yanked: ${{ inputs.yanked }}
      publish: ${{ vars.VOXTA_PUBLISH == 'true' }}
      api-url: ${{ vars.VOXTA_API_URL || 'https://api.voxta.ai' }}
